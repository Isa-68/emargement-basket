<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Émargement Basket — test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;color:#222}
main{max-width:650px;margin:30px auto;padding:15px}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
h1{text-align:center;font-size:24px}
input{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;font-size:16px}
button{border:0;border-radius:9px;padding:12px 16px;font-size:16px;cursor:pointer}
.primary{background:#111;color:#fff;width:100%}
.teams{display:flex;gap:8px}.teams button{flex:1;background:#ddd;font-weight:bold}.teams .active{background:#111;color:#fff}
.player{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0;font-weight:bold}
.present{background:#b9efc5;font-size:22px;width:52px;height:46px}
.status{margin-top:10px;color:#666;font-size:14px}
.error{color:#b00020}
.hidden{display:none}
</style>
</head>
<body>
<main>
<div id="login" class="card">
<h1>🏀 Émargement Basket</h1>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Mot de passe">
<button id="loginBtn" class="primary" type="button" onclick="window.loginNow()">Se connecter</button>
<div id="loginMsg" class="status"></div>
</div>

<div id="app" class="hidden">
<div class="card">
<h1>🏀 Émargement</h1>
<div class="teams">
<button id="u11">U11F</button>
<button id="u18">U18F</button>
</div>
<div class="status" id="sync"></div>
</div>

<div class="card">
<h2 id="teamTitle"></h2>
<div id="players"></div>
</div>
</div>
</main>

<script>
const SUPABASE_URL='https://roqfjstasmlcfasmzjdk.supabase.co';
const SUPABASE_KEY='sb_publishable_4dyWekEBF7mttdHt_6PqXw_mN-Mu4tA';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let teamCode='U11F',teamId=null,players=[],sessionId=null,marks=[];

const $=id=>document.getElementById(id);

function status(text,error=false){
  $('sync').textContent=text;
  $('sync').className='status'+(error?' error':'');
}

async function getTeam(){
  const r=await db.from('teams').select('id,code').eq('code',teamCode).single();
  if(r.error) throw r.error;
  teamId=r.data.id;
}

async function getSession(){
  const today=new Date().toISOString().slice(0,10);
  const found=await db.from('sessions').select('id').eq('team_id',teamId).eq('session_date',today).eq('session_type','Entraînement').maybeSingle();
  if(found.error) throw found.error;
  if(found.data) return found.data.id;
  const created=await db.from('sessions').insert({
    team_id:teamId,session_date:today,session_type:'Entraînement'
  }).select('id').single();
  if(created.error) throw created.error;
  return created.data.id;
}

async function load(){
  try{
    status('Chargement…');
    await getTeam();
    const p=await db.from('players').select('id,name').eq('team_id',teamId).order('name');
    if(p.error) throw p.error;
    players=p.data||[];
    sessionId=await getSession();
    const a=await db.from('attendance').select('id,player_id,status,late').eq('session_id',sessionId);
    if(a.error) throw a.error;
    marks=a.data||[];
    render();
    status('✓ Chargé');
  }catch(e){
    console.error(e);
    status('Erreur : '+e.message,true);
  }
}

function render(){
  $('teamTitle').textContent=teamCode;
  $('u11').classList.toggle('active',teamCode==='U11F');
  $('u18').classList.toggle('active',teamCode==='U18F');
  const box=$('players'); box.innerHTML='';
  players.forEach(p=>{
    const mark=marks.find(a=>a.player_id===p.id);
    const row=document.createElement('div'); row.className='player';
    const name=document.createElement('span'); name.textContent=p.name;
    const b=document.createElement('button'); b.type='button'; b.className='present';
    b.textContent=mark?.status==='present'?'✓':'🟢';
    b.title='Présente';
    b.addEventListener('click',()=>setPresent(p.id));
    row.append(name,b); box.appendChild(row);
  });
}

async function setPresent(playerId){
  status('Enregistrement…');
  const old=marks.find(a=>a.player_id===playerId);
  const payload={
    session_id:sessionId,
    player_id:playerId,
    status:'present',
    late:old?.status==='present' ? !!old.late : false
  };
  const r=await db.from('attendance').upsert(payload,{onConflict:'session_id,player_id'});
  if(r.error){
    console.error(r.error); status('Erreur : '+r.error.message,true); return;
  }
  if(old) Object.assign(old,payload);
  else marks.push(payload);
  render();
  status('✓ Présence enregistrée');
}

window.loginNow=async function(){
  const m=$('loginMsg');
  m.textContent='Connexion…';
  m.className='status';
  try{
    const r=await db.auth.signInWithPassword({
      email:$('email').value.trim(),
      password:$('password').value
    });
    if(r.error){
      m.textContent='Erreur : '+r.error.message;
      m.className='status error';
      return;
    }
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    await load();
  }catch(e){
    console.error(e);
    m.textContent='Erreur : '+(e?.message||String(e));
    m.className='status error';
  }
};

$('u11').addEventListener('click',async()=>{teamCode='U11F';await load()});
$('u18').addEventListener('click',async()=>{teamCode='U18F';await load()});

db.auth.getSession().then(({data})=>{
  if(data.session){
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    load();
  }
});
</script>
</body>
</html>
