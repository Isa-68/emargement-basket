<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Émargement Basket</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;color:#222}
main{max-width:900px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
h1{text-align:center;margin:4px 0 18px;font-size:25px}
h2{margin:0 0 12px}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font-size:16px;margin:5px 0}
button{border:0;border-radius:9px;padding:11px 14px;font-size:16px;cursor:pointer}
.primary{background:#222;color:#fff;width:100%;margin-top:8px}
.logout{float:right;background:#eee;font-size:13px;padding:7px 10px}
.teams{display:flex;gap:8px;margin-bottom:14px}
.teams button{flex:1;background:#ddd;font-weight:bold}
.teams button.active{background:#222;color:#fff}
.view{display:block}
#statsView{display:none}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{background:#f5f5f5;border-radius:10px;padding:12px;text-align:center}
.stat strong{display:block;font-size:22px;margin-bottom:4px}
.stat span{font-size:13px;color:#666}
.stats-table{width:100%;border-collapse:collapse;margin-top:10px}
.stats-table th,.stats-table td{padding:9px 6px;border-bottom:1px solid #eee;text-align:center}
.stats-table th:first-child,.stats-table td:first-child{text-align:left}
@media(max-width:700px){.stats-grid{grid-template-columns:repeat(2,1fr)}.stats-table{font-size:13px}.stats-table th,.stats-table td{padding:7px 3px}}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar button{background:#eee}
.date{width:auto;margin:0}
.player{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:11px 0}
.player:last-child{border-bottom:0}
.name{font-weight:bold;flex:1}
.statuses{display:flex;gap:5px;align-items:center}
.st{width:44px;height:42px;padding:0;font-size:21px;background:#eee}
.st.selected{outline:3px solid #222}
.present{background:#b9eec5}
.absent{background:#ffc2c2}
.excused{background:#ffe89a}
.injured{background:#b8dcff}
.late{display:flex;align-items:center;gap:4px;font-size:13px;white-space:nowrap}
.late input{width:18px;height:18px;margin:0}
.muted{color:#666;font-size:14px}
#app{display:none}
#login{max-width:420px;margin:60px auto}
#message{min-height:22px;text-align:center;margin:8px 0}
.success{color:#16743a}.error{color:#a00000}
.add{display:flex;gap:8px}.add input{margin:0}.add button{white-space:nowrap;background:#222;color:white}
</style>
</head>
<body>
<main>
<section id="login" class="card">
  <h1>🏀 Émargement Basket</h1>
  <p class="muted">Connexion</p>
  <input id="email" type="email" placeholder="Adresse e-mail" autocomplete="username">
  <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password">
  <button id="loginBtn" class="primary">Se connecter</button>
  <div id="loginMsg"></div>
</section>

<section id="app">
  <button id="logoutBtn" class="logout">Déconnexion</button>
  <h1>🏀 Émargement Basket</h1>

  <div class="teams">
    <button id="u11Btn">U11F</button>
    <button id="u18Btn">U18F</button>
  </div>
  <div class="teams">
    <button id="attendanceTab" class="active">Émargement</button>
    <button id="statsTab">Statistiques</button>
  </div>

  <div class="card">
    <div class="toolbar">
      <input id="date" class="date" type="date">
      <button id="allPresent">🟢 Tout le monde présent</button>
    </div>
    <p id="sessionMsg" class="muted"></p>
  </div>

  <div id="attendanceView" class="view">
    <div class="card">
      <h2 id="teamTitle">U11F</h2>
      <div id="players"></div>
      <div class="add">
        <input id="newPlayer" type="text" placeholder="Ajouter une joueuse">
        <button id="addPlayer">Ajouter</button>
      </div>
    </div>
  </div>

  <div id="statsView" class="view">
    <div class="card">
      <h2>Statistiques de l'équipe</h2>
      <div id="teamStats"></div>
    </div>
    <div class="card">
      <h2>Assiduité des joueuses</h2>
      <div id="playerStats"></div>
    </div>
  </div>
</section>
</main>

<script>
const SUPABASE_URL = "https://roqfjstasmlcfasmzjdk.supabase.co";
const SUPABASE_KEY = "sb_publishable_4dyWekEBF7mttdHt_6PqXw_mN-Mu4tA";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STATUS = {
  present: "🟢",
  absent: "🔴",
  excused: "🟡",
  injured: "🔵"
};

let team = null;
let players = [];
let attendance = {};
let session = null;

const $ = id => document.getElementById(id);

function today(){
  const d = new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
$("date").value = today();


function msg(text, ok=false){
  $("sessionMsg").textContent=text;
  $("sessionMsg").className=ok ? "success" : "muted";
}

async function login(){
  $("loginMsg").textContent="Connexion…";
  const {error}=await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(error){
    $("loginMsg").textContent=error.message;
    $("loginMsg").className="error";
  }else{
    $("loginMsg").textContent="";
    showApp();
  }
}

async function logout(){
  await db.auth.signOut();
  $("app").style.display="none";
  $("login").style.display="block";
}

async function showApp(){
  $("login").style.display="none";
  $("app").style.display="block";
  await loadTeam("U11F");
}

async function loadTeam(code){
  const {data,error}=await db.from("teams").select("*").eq("code",code).maybeSingle();
  if(error){ msg("Erreur équipe : "+error.message); return; }
  if(!data){ msg("Équipe "+code+" introuvable."); return; }
  team=data;
  $("u11Btn").classList.toggle("active",code==="U11F");
  $("u18Btn").classList.toggle("active",code==="U18F");
  $("teamTitle").textContent=code;
  await loadPlayers();
  await loadSession();
  if($("statsView").style.display!=="none") await loadStats();
}

async function loadPlayers(){
  const {data,error}=await db.from("players").select("*").eq("team_id",team.id).order("name",{ascending:true});
  if(error){msg("Erreur joueuses : "+error.message);return;}
  players=data||[];
  render();
}

async function loadSession(){
  attendance={};
  const date=$("date").value;
  let {data,error}=await db.from("sessions")
    .select("*")
    .eq("team_id",team.id)
    .eq("session_date",date)
    .eq("session_type","Entraînement")
    .maybeSingle();

  if(error){msg("Erreur séance : "+error.message);return;}

  if(!data){
    const ins=await db.from("sessions").insert({
      team_id:team.id,session_date:date,session_type:"Entraînement"
    }).select().single();
    if(ins.error){msg("Erreur création séance : "+ins.error.message);return;}
    data=ins.data;
  }
  session=data;

  const a=await db.from("attendance").select("*").eq("session_id",session.id);
  if(a.error){msg("Erreur émargement : "+a.error.message);return;}
  (a.data||[]).forEach(x=>attendance[x.player_id]=x);
  render();
  msg("Séance du "+date.split("-").reverse().join("/")+" prête.",true);
}

function render(){
  $("players").innerHTML="";
  if(!players.length){
    $("players").innerHTML='<p class="muted">Aucune joueuse dans cette équipe.</p>';
    return;
  }

  players.forEach(p=>{
    const a=attendance[p.id]||{status:null,late:false};
    const row=document.createElement("div");
    row.className="player";

    const name=document.createElement("div");
    name.className="name";
    name.textContent=p.name;

    const statuses=document.createElement("div");
    statuses.className="statuses";

    ["present","absent","excused","injured"].forEach(s=>{
      const b=document.createElement("button");
      b.type="button";
      b.className=`st ${s} ${a.status===s?"selected":""}`;
      b.textContent=STATUS[s];
      b.title={present:"Présente",absent:"Absente non excusée",excused:"Absente excusée",injured:"Absente blessée"}[s];
      b.addEventListener("click",()=>setStatus(p.id,s));
      statuses.appendChild(b);
    });

    const late=document.createElement("label");
    late.className="late";
    late.innerHTML='<input type="checkbox"> R';
    late.querySelector("input").checked=!!a.late;
    late.querySelector("input").addEventListener("change",e=>setLate(p.id,e.target.checked));

    statuses.appendChild(late);
    row.append(name,statuses);
    $("players").appendChild(row);
  });
}

async function setStatus(playerId,status){
  if(!session){msg("Aucune séance.");return;}
  const old=attendance[playerId];
  attendance[playerId]={...(old||{}),status};
  render();

  const {data,error}=await db.from("attendance").upsert({
    session_id:session.id,
    player_id:playerId,
    status:status,
    late:!!attendance[playerId].late
  },{onConflict:"session_id,player_id"});

  if(error){
    msg("Erreur d'enregistrement : "+error.message);
    if(old) attendance[playerId]=old; else delete attendance[playerId];
    render();
    return;
  }
  msg("Présence enregistrée.",true);
  if($("statsView").style.display!=="none") loadStats();
}

async function setLate(playerId,late){
  if(!session)return;
  const old=attendance[playerId];
  if(!old || !old.status){
    msg("Choisis d'abord un statut.");
    render();
    return;
  }
  attendance[playerId]={...old,late};
  const {data,error}=await db.from("attendance").upsert({
    session_id:session.id,
    player_id:playerId,
    status:old.status,
    late
  },{onConflict:"session_id,player_id"});
  if(error){msg("Erreur : "+error.message);return;}
  msg("Retard enregistré.",true);
  if($("statsView").style.display!=="none") loadStats();
}

async function allPresent(){
  if(!session)return;
  msg("Enregistrement…");
  for(const p of players){
    const old=attendance[p.id];
    const {data,error}=await db.from("attendance").upsert({
      session_id:session.id,
      player_id:p.id,
      status:"present",
      late:!!(old&&old.late)
    },{onConflict:"session_id,player_id"});
    if(error){msg("Erreur : "+error.message);return;}
  }
  render();
  msg("Tout le monde est marqué présent.",true);
  if($("statsView").style.display!=="none") loadStats();
}

async function addPlayer(){
  const name=$("newPlayer").value.trim();
  if(!name){return;}
  const {error}=await db.from("players").insert({team_id:team.id,name});
  if(error){msg("Erreur ajout : "+error.message);return;}
  $("newPlayer").value="";
  await loadPlayers();
  msg(name+" a été ajoutée.",true);
  if($("statsView").style.display!=="none") loadStats();
}


let allSessions = [];
let allAttendance = [];

async function loadStats(){
  if(!team) return;

  const s = await db.from("sessions")
    .select("id,session_date,session_type")
    .eq("team_id",team.id)
    .eq("session_type","Entraînement")
    .order("session_date",{ascending:true});

  if(s.error){ $("teamStats").innerHTML='<p class="error">Erreur statistiques : '+s.error.message+'</p>'; return; }
  allSessions=s.data||[];

  const ids=allSessions.map(x=>x.id);
  if(!ids.length){
    allAttendance=[];
  }else{
    const a=await db.from("attendance")
      .select("session_id,player_id,status,late")
      .in("session_id",ids);
    if(a.error){ $("teamStats").innerHTML='<p class="error">Erreur statistiques : '+a.error.message+'</p>'; return; }
    allAttendance=a.data||[];
  }

  const total=allSessions.length;
  let present=0, absent=0, excused=0, injured=0, late=0;

  allAttendance.forEach(a=>{
    if(a.status==="present") present++;
    if(a.status==="absent") absent++;
    if(a.status==="excused") excused++;
    if(a.status==="injured") injured++;
    if(a.late) late++;
  });

  const totalRecorded=present+absent+excused+injured;
  const presencePct=totalRecorded ? Math.round((present/totalRecorded)*1000)/10 : 0;

  $("teamStats").innerHTML=`
    <div class="stats-grid">
      <div class="stat"><strong>${total}</strong><span>Entraînements</span></div>
      <div class="stat"><strong>${present}</strong><span>Présences</span></div>
      <div class="stat"><strong>${late}</strong><span>Retards</span></div>
      <div class="stat"><strong>${absent}</strong><span>Abs. non exc.</span></div>
      <div class="stat"><strong>${excused+injured}</strong><span>Absences exc./bless.</span></div>
    </div>
    <p class="muted">Taux de présence enregistré : <strong>${presencePct}%</strong> · Absences totales : <strong>${absent+excused+injured}</strong></p>
  `;

  const rows=players.map(p=>{
    const mine=allAttendance.filter(a=>a.player_id===p.id);
    const pCount=mine.filter(a=>a.status==="present").length;
    const lCount=mine.filter(a=>a.late).length;
    const aCount=mine.filter(a=>a.status==="absent").length;
    const eCount=mine.filter(a=>a.status==="excused").length;
    const iCount=mine.filter(a=>a.status==="injured").length;
    const recorded=mine.length;
    const pct=recorded ? Math.round((pCount/recorded)*1000)/10 : 0;
    return `<tr>
      <td>${escapeHtml(p.name)}</td>
      <td>${recorded}/${total}</td>
      <td>${pCount}</td>
      <td>${lCount}</td>
      <td>${aCount}</td>
      <td>${eCount}</td>
      <td>${iCount}</td>
      <td>${pct}%</td>
    </tr>`;
  }).join("");

  $("playerStats").innerHTML=`
    <div style="overflow-x:auto">
    <table class="stats-table">
      <thead><tr>
        <th>Joueuse</th><th>Séances</th><th>Prés.</th><th>Ret.</th><th>Abs.</th><th>Exc.</th><th>Bless.</th><th>%</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <p class="muted">Les retards comptent comme des présences dans le pourcentage.</p>
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function showView(which){
  $("attendanceView").style.display=which==="attendance"?"block":"none";
  $("statsView").style.display=which==="stats"?"block":"none";
  $("attendanceTab").classList.toggle("active",which==="attendance");
  $("statsTab").classList.toggle("active",which==="stats");
  if(which==="stats") loadStats();
}

$("loginBtn").addEventListener("click",login);
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("logoutBtn").addEventListener("click",logout);
$("u11Btn").addEventListener("click",()=>loadTeam("U11F"));
$("u18Btn").addEventListener("click",()=>loadTeam("U18F"));
$("date").addEventListener("change",loadSession);
$("allPresent").addEventListener("click",allPresent);
$("addPlayer").addEventListener("click",addPlayer);
$("newPlayer").addEventListener("keydown",e=>{if(e.key==="Enter")addPlayer()});
$("attendanceTab").addEventListener("click",()=>showView("attendance"));
$("statsTab").addEventListener("click",()=>showView("stats"));

(async()=>{
  const {data}=await db.auth.getSession();
  if(data.session) showApp();
  else $("login").style.display="block";
})();
</script>
</body>
</html>
