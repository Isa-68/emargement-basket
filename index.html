<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Émargement Basket</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:14px;text-align:center}h1{margin:0;font-size:22px}
main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
.team{display:flex;gap:8px}.team button{flex:1;padding:13px;font-size:18px;font-weight:bold;border:0;border-radius:9px;background:#ddd}.team button.active{background:#111;color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{padding:11px;font-size:16px;flex:1;min-width:180px}
button{cursor:pointer}.primary{background:#111;color:white;border:0;border-radius:8px;padding:11px 14px;font-weight:bold}
#status{font-size:13px;color:#666;margin-top:8px}.summary{text-align:center;font-size:18px;font-weight:bold;margin:10px 0}
.player{display:grid;grid-template-columns:minmax(150px,1fr) repeat(4,42px) 34px;gap:6px;align-items:center;margin:7px 0}
.player .name{font-weight:bold;overflow:hidden;text-overflow:ellipsis}.status{width:42px;height:42px;border:2px solid #ddd;border-radius:8px;font-size:19px;background:#fff}
.status.on{border:3px solid #111}.green{background:#b9efc5}.red{background:#ffb8b8}.yellow{background:#ffe78c}.blue{background:#a9d8ff}
.late{width:32px;height:32px;border-radius:50%;border:1px solid #aaa;background:#fff;font-weight:bold}.late.on{background:#111;color:#fff}
.remove{background:none;border:0;color:#b00020;font-size:18px}
.small{font-size:12px;color:#777}.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:center}th:first-child,td:first-child{text-align:left}
#login{max-width:420px;margin:70px auto;padding:20px}.login input{display:block;width:100%;margin:8px 0;padding:12px;font-size:16px}
.error{color:#b00020}.ok{color:#187a35}
</style>
</head>
<body>
<div id="login" class="card">
<h1>🏀 Émargement Basket</h1>
<div class="login">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Mot de passe">
<button id="loginBtn" class="primary" style="width:100%">Se connecter</button>
<div id="loginMsg" class="small"></div>
</div>
</div>

<div id="app" class="hidden">
<header><h1>🏀 Émargement</h1></header>
<main>
<div class="card">
<div class="team"><button id="u11">U11F</button><button id="u18">U18F</button></div>
<div class="row" style="margin-top:12px">
<label>Date : <input id="date" type="date"></label>
<button id="all" class="primary">✅ Tout le monde présent</button>
</div>
<div id="status"></div>
</div>

<div class="card">
<div id="summary" class="summary">0 / 0 présentes</div>
<div id="players"></div>
<div class="row" style="margin-top:12px">
<input id="newName" placeholder="Nom et prénom de la joueuse">
<button id="add" class="primary">+ Ajouter</button>
</div>
</div>

<div class="card">
<h2>📊 Assiduité</h2>
<div id="stats"></div>
</div>
</main>
</div>

<script>
const URL='https://roqfjstasmlcfasmzjdk.supabase.co';
const KEY='sb_publishable_4dyWekEBF7mttdHt_6PqXw_mN-Mu4tA';
const db=supabase.createClient(URL,KEY);

let teamCode='U11F', teamId=null, players=[], sessions=[], marks=[];
let selectedDate=new Date().toISOString().slice(0,10);

const $=id=>document.getElementById(id);
$('date').value=selectedDate;

function msg(t,cls=''){ $('status').textContent=t; $('status').className=cls; }
function currentSession(){return sessions.find(s=>s.team_id===teamId && s.session_date===selectedDate && s.session_type==='Entraînement')}
function mark(pid){let s=currentSession();return marks.find(a=>a.player_id===pid&&a.session_id===s?.id)}
function setActiveTeam(){ $('u11').classList.toggle('active',teamCode==='U11F'); $('u18').classList.toggle('active',teamCode==='U18F'); }

async function getTeam(){
 const r=await db.from('teams').select('*').eq('code',teamCode).single();
 if(r.error) throw r.error;
 teamId=r.data.id;
}
async function getSession(create=true){
 let s=currentSession();
 if(s || !create) return s;
 const r=await db.from('sessions').insert({team_id:teamId,session_date:selectedDate,session_type:'Entraînement'}).select().single();
 if(r.error) throw r.error;
 sessions.push(r.data); return r.data;
}
async function load(){
 try{
  msg('Synchronisation…');
  await getTeam();
  let pr=await db.from('players').select('*').eq('team_id',teamId).order('name');
  if(pr.error) throw pr.error;
  players=pr.data||[];
  let ss=await db.from('sessions').select('*').eq('team_id',teamId).order('session_date',{ascending:false});
  if(ss.error) throw ss.error;
  sessions=ss.data||[];
  let s=currentSession();
  if(s){
   let ar=await db.from('attendance').select('*').eq('session_id',s.id);
   if(ar.error) throw ar.error;
   marks=ar.data||[];
  }else marks=[];
  render(); await loadStats();
  msg('✓ Synchronisé');
 }catch(e){console.error(e);msg('Erreur : '+e.message,'error')}
}

function render(){
 setActiveTeam();
 const present=marks.filter(a=>a.status==='present').length;
 $('summary').textContent=present+' / '+players.length+' présentes'+(marks.filter(a=>a.status==='present'&&a.late).length?' · '+marks.filter(a=>a.status==='present'&&a.late).length+' retard':'');
 $('players').innerHTML='';
 players.forEach(p=>{
  const a=mark(p);
  const div=document.createElement('div');div.className='player';
  const name=document.createElement('div');name.className='name';name.textContent=p.name;
  div.appendChild(name);
  [['present','🟢','green'],['absent','🔴','red'],['excused','🟡','yellow'],['injured','🔵','blue']].forEach(([st,icon,cl])=>{
   const b=document.createElement('button');b.className='status '+cl+(a?.status===st?' on':'');b.textContent=icon;
   b.title=st;b.addEventListener('click',()=>saveStatus(p.id,st));div.appendChild(b);
  });
  const l=document.createElement('button');l.className='late'+(a?.status==='present'&&a?.late?' on':'');l.textContent='R';l.title='Retard';
  l.addEventListener('click',()=>toggleLate(p.id));div.appendChild(l);
  $('players').appendChild(div);
 });
}

async function saveStatus(pid,status){
 try{
  const s=await getSession(true);
  const old=mark(pid);
  const payload={session_id:s.id,player_id:pid,status,late:status==='present'?(old?.late||false):false};
  const r=await db.from('attendance').upsert(payload,{onConflict:'session_id,player_id'}).select().single();
  if(r.error) throw r.error;
  const i=marks.findIndex(x=>x.player_id===pid);
  if(i>=0)marks[i]=r.data;else marks.push(r.data);
  render();msg('✓ Enregistré');
  loadStats();
 }catch(e){console.error(e);msg('Erreur : '+e.message,'error')}
}
async function toggleLate(pid){
 const a=mark(pid); if(!a||a.status!=='present')return;
 try{
  const r=await db.from('attendance').update({late:!a.late}).eq('id',a.id).select().single();
  if(r.error)throw r.error;
  Object.assign(a,r.data);render();msg('✓ Enregistré');
 }catch(e){console.error(e);msg('Erreur : '+e.message,'error')}
}
async function allPresent(){
 try{
  const s=await getSession(true);
  const rows=players.map(p=>{const a=mark(p);return {session_id:s.id,player_id:p.id,status:'present',late:a?.status==='present'&&a?.late||false}});
  const r=await db.from('attendance').upsert(rows,{onConflict:'session_id,player_id'}).select();
  if(r.error)throw r.error;
  marks=r.data||[];render();msg('✓ Toutes les présences sont enregistrées');loadStats();
 }catch(e){console.error(e);msg('Erreur : '+e.message,'error')}
}
async function addPlayer(){
 const name=$('newName').value.trim();if(!name)return;
 try{
  const r=await db.from('players').insert({team_id:teamId,name}).select().single();
  if(r.error)throw r.error;
  players.push(r.data);players.sort((a,b)=>a.name.localeCompare(b.name,'fr'));$('newName').value='';render();msg('✓ Joueuse ajoutée');
 }catch(e){console.error(e);msg('Erreur : '+e.message,'error')}
}
async function loadStats(){
 let r=await db.from('sessions').select('*').eq('team_id',teamId).order('session_date',{ascending:false});
 if(r.error)return;
 const ss=r.data||[]; if(!ss.length){$('stats').innerHTML='<div class="small">Aucune séance enregistrée.</div>';return}
 const ids=ss.map(s=>s.id);
 let ar=await db.from('attendance').select('*').in('session_id',ids);if(ar.error)return;
 const all=ar.data||[];
 let h='<table><tr><th>Date</th><th>Présentes</th><th>Retards</th><th>Abs. NC</th><th>Abs. exc.</th><th>Blessées</th></tr>';
 ss.forEach(s=>{let x=all.filter(a=>a.session_id===s.id);h+=`<tr><td>${new Date(s.session_date+'T12:00:00').toLocaleDateString('fr-FR')}</td><td>${x.filter(a=>a.status==='present').length}</td><td>${x.filter(a=>a.status==='present'&&a.late).length}</td><td>${x.filter(a=>a.status==='absent').length}</td><td>${x.filter(a=>a.status==='excused').length}</td><td>${x.filter(a=>a.status==='injured').length}</td></tr>`});
 h+='</table><p class="small">Le retard compte comme une présence.</p>'; $('stats').innerHTML=h;
}

$('loginBtn').addEventListener('click',async()=>{
 $('loginMsg').textContent='Connexion…';
 const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 if(r.error){$('loginMsg').textContent=r.error.message;$('loginMsg').className='error';return}
 $('login').classList.add('hidden');$('app').classList.remove('hidden');load();
});
$('u11').addEventListener('click',async()=>{teamCode='U11F';marks=[];await load()});
$('u18').addEventListener('click',async()=>{teamCode='U18F';marks=[];await load()});
$('date').addEventListener('change',async()=>{selectedDate=$('date').value;await load()});
$('all').addEventListener('click',allPresent);
$('add').addEventListener('click',addPlayer);
$('newName').addEventListener('keydown',e=>{if(e.key==='Enter')addPlayer()});

db.auth.getSession().then(({data})=>{
 if(data.session){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}
});
</script>
</body>
</html>
